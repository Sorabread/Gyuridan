<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규리단길 뿌시기♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6EE;
    --ink:#5E4B45;
    --soft:#A08F87;
    --line:#F3E4DA;
    --pink:#FF9EB5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Gowun Dodum',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* 몽실몽실 배경 */
  .blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75}
  .blobs i:nth-child(1){width:280px;height:280px;background:#FFD6E0;top:-80px;left:-90px}
  .blobs i:nth-child(2){width:240px;height:240px;background:#FFE9C4;top:120px;right:-110px}
  .blobs i:nth-child(3){width:300px;height:300px;background:#E3DBFF;bottom:-120px;left:-60px}
  .blobs i:nth-child(4){width:200px;height:200px;background:#D2F0E2;bottom:180px;right:-70px}

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 12px 60px}

  header{text-align:center;position:relative;padding:18px 0 6px}
  .cloud{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:290px;height:120px;z-index:-1;
  }
  h1{
    font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;
    font-size:36px;margin:22px 0 4px;letter-spacing:-.5px;
    color:#E77C98;
    text-shadow:0 3px 0 #fff, 0 6px 14px rgba(231,124,152,.25);
  }
  h1 .heart{display:inline-block;animation:beat 1.6s ease-in-out infinite;color:#FF8FAB}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  .sub{font-size:13.5px;color:var(--soft);margin:2px 0 14px}
  .hint{
    display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.75);border:1.5px dashed #F5CDD6;
    border-radius:999px;padding:8px 16px;font-size:12.5px;color:#8C7169;
  }
  .hint b{color:#E77C98;font-weight:400}
  .hint-lead{width:100%;font-weight:700;color:#C9788C}

  .cal{
    margin-top:18px;background:rgba(255,255,255,.88);
    border-radius:30px;padding:16px 8px 10px;
    box-shadow:0 12px 34px rgba(232,170,150,.22), 0 2px 0 #fff inset;
    border:2px solid #fff;
  }
  .cal-top{display:flex;align-items:center;justify-content:space-between;padding:0 10px 12px}
  .month{font-family:'Jua',sans-serif;font-size:22px;color:#D9879B}
  .month small{font-family:'Gowun Dodum',sans-serif;font-size:12px;color:var(--soft);margin-left:6px}
  .legend{font-size:11.5px;color:var(--soft);display:flex;align-items:center;gap:4px}
  .legend .dot{width:9px;height:9px;border-radius:50%;background:#FFB3C6;display:inline-block}

  .dow,.dates,.bars,.cols{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow div{text-align:center;font-size:12px;color:var(--soft);padding-bottom:6px}
  .dow div:first-child{color:#E8899F}
  .dow div:last-child{color:#7FA6D6}

  .week{position:relative;border-top:1.5px solid var(--line);padding-bottom:6px}
  .cols{position:absolute;inset:0;pointer-events:none}
  .cols div{margin:3px 1px;border-radius:16px;transition:background .2s}
  .cols div.sel{background:#FFF0DC}
  .cols div.bday{background:#FFEAF0}
  .cols div.sel.bday{background:#FFE0EA;box-shadow:inset 0 0 0 2px #FFC4D3}

  .dates button{
    position:relative;background:none;border:0;padding:7px 0 4px;margin:0;
    font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .dates .num{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;
    transition:transform .15s;
  }
  .dates button:active .num{transform:scale(.88)}
  .dates .sun .num{color:#E07B93}
  .dates .sat .num{color:#6F98CC}
  .dates .off .num{color:#D6C9C2}
  .dates .today .num{background:#FFE7B3;color:#8A6110}
  .dates .bdayc .num{background:linear-gradient(135deg,#FFB3C6,#FFC9A8);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(255,150,170,.4)}
  .dates .tag{font-size:9.5px;line-height:1;height:10px;color:#E8899F}
  .dates .today .tag{color:#B8902F}

  .bars{grid-auto-rows:25px;row-gap:4px;padding:2px 0 2px;position:relative}
  .bar{
    margin:0 2px;border-radius:13px;font-size:11.5px;line-height:25px;padding:0 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    box-shadow:0 2px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(180,130,120,.12);
    transition:transform .15s, filter .15s;
  }
  .bar.cl{border-top-left-radius:5px;border-bottom-left-radius:5px;margin-left:0;padding-left:6px}
  .bar.cr{border-top-right-radius:5px;border-bottom-right-radius:5px;margin-right:0}
  .bar.cl::before{content:'‹ ';opacity:.5}

  /* 꾹 누르기 진행 표시 */
  .pressable{position:relative;overflow:hidden}
  .pressable::after{
    content:'';position:absolute;left:0;top:0;bottom:0;width:0;
    background:rgba(255,255,255,.55);pointer-events:none;
  }
  .pressable.pressing::after{width:100%;transition:width .55s linear}
  .pressable.pressing{transform:scale(.97)}
  .pressable.pressed{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

  /* 날짜별 리스트 */
  .list-wrap{margin-top:20px}
  .list-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
  .list-title{font-family:'Jua',sans-serif;font-size:19px;color:#C9788C}
  .list-title small{font-family:'Gowun Dodum',sans-serif;font-size:12.5px;color:var(--soft);margin-left:4px}
  .toggle{
    border:0;font:inherit;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    background:#fff;color:#C9788C;box-shadow:0 3px 10px rgba(232,170,150,.25);
  }
  .toggle.on{background:#FFB3C6;color:#fff}
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{
    background:rgba(255,255,255,.92);border-radius:22px;padding:13px 15px 13px 16px;cursor:pointer;
    display:flex;gap:12px;align-items:center;border:2px solid #fff;
    box-shadow:0 6px 18px rgba(232,170,150,.16);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    transition:transform .15s;
  }
  .card .chip{width:44px;height:44px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:20px}
  .card .body{min-width:0;flex:1}
  .card .venue{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hrs{font-size:11.5px;font-weight:400;background:#FFF4E6;color:#9A7240;border-radius:999px;padding:2px 8px}
  .hrs.tbd{background:#F4EEEA;color:#B5A69E}
  .hrs.off{background:#FFE8EC;color:#C25570}
  .hbox{margin-top:12px;background:#fff;border-radius:18px;padding:12px 12px 10px;box-shadow:0 2px 10px rgba(232,170,150,.15)}
  .hlbl{font-size:13px;font-weight:700;margin:0 2px 8px}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
  .hchip{background:#FFF8F1;border-radius:12px;padding:6px 2px;text-align:center;line-height:1.25}
  .hchip b{display:block;font-size:14px;color:#7D6A63}
  .hchip b small{font-size:10px;font-weight:400;margin-left:2px;opacity:.75}
  .hchip span{display:block;font-size:11.5px;color:#9A7240}
  .hchip.off{background:#FFE8EC}
  .hchip.off span,.hchip.off b{color:#C25570}
  .hchip.bd{box-shadow:inset 0 0 0 2px #FFC4D3}
  .hchip.td{box-shadow:inset 0 0 0 2px #F3D08A}
  .hnote{font-size:11.5px;color:var(--soft);margin:8px 2px 0;line-height:1.5}
  .s-when{flex-wrap:wrap}
  .s-when span.offs{color:#C25570}
  .s-when span.tbd{color:#B5A69E}
  .card .ev{font-size:13px;color:#7D6A63;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:11.5px;color:var(--soft);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .card .meta .at{color:#B9A39A}
  .card .arrow{color:#E5CFC6;font-size:18px;flex:none}
  .empty{text-align:center;color:var(--soft);font-size:13.5px;padding:24px 0;background:rgba(255,255,255,.6);border-radius:22px}

  /* 바텀시트 */
  .backdrop{
    position:fixed;inset:0;background:rgba(110,80,70,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;
  }
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;bottom:0;width:100%;max-width:560px;z-index:21;
    transform:translate(-50%,105%);transition:transform .33s cubic-bezier(.2,.9,.3,1.1), visibility .33s;
    background:#FFFBF7;border-radius:30px 30px 0 0;padding:10px 18px 26px;
    box-shadow:0 -10px 30px rgba(180,120,110,.18);max-height:86vh;overflow-y:auto;
    visibility:hidden;
  }
  .sheet.show{transform:translate(-50%,0);visibility:visible}
  .handle{width:44px;height:5px;border-radius:9px;background:#EBD9D0;margin:0 auto 12px}
  .close{
    position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;
    background:#F6EAE3;color:#A08F87;font-size:16px;cursor:pointer;
  }
  .s-badge{display:inline-block;font-size:12px;border-radius:999px;padding:5px 11px;margin-top:4px}
  .s-venue{font-family:'Jua',sans-serif;font-size:27px;margin:10px 0 2px}
  .s-ev{font-size:15px;color:#7D6A63;word-break:break-all}
  .s-when{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:#7D6A63}
  .s-when span{background:#fff;border-radius:12px;padding:6px 11px;box-shadow:0 2px 8px rgba(232,170,150,.15)}
  .maplink{
    margin-top:12px;display:flex;align-items:center;gap:10px;text-decoration:none;
    background:#EAF8EE;border:2px solid #CDEFD7;border-radius:16px;padding:10px 14px;
    color:#2E7D4A;font-size:14px;
  }
  .maplink:active{transform:scale(.98)}
  .maplink b{font-weight:700}
  .maplink .nv{
    width:26px;height:26px;border-radius:8px;background:#03C75A;color:#fff;flex:none;
    display:grid;place-items:center;font-weight:900;font-size:14px;font-family:Arial,sans-serif;
  }
  .maplink .go{margin-left:auto;font-size:18px;color:#7DBF92}
  .idrow{
    margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fff;border-radius:16px;padding:10px 12px 10px 14px;
    box-shadow:0 2px 10px rgba(232,170,150,.15);
  }
  .idrow .id{font-size:15px;font-weight:700;word-break:break-all}
  .mini{
    border:0;font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;flex:none;
    background:#F6EAE3;color:#8C7169;
  }
  .note{font-size:11.5px;color:var(--soft);margin-top:6px;padding-left:4px}
  .tagbox{
    margin-top:14px;position:relative;border-radius:22px;padding:54px 14px 14px;
  }
  .tagbox .lbl{position:absolute;left:16px;top:14px;font-size:13px;font-weight:700}
  .copyall{
    position:absolute;right:10px;top:9px;border:0;font:inherit;font-size:12.5px;cursor:pointer;
    padding:7px 13px;border-radius:999px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.06);
    display:flex;align-items:center;gap:5px;
  }
  .copyall:active{transform:scale(.95)}
  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tags button{
    border:0;font:inherit;font-size:13.5px;background:rgba(255,255,255,.85);border-radius:14px;
    padding:8px 11px;cursor:pointer;text-align:left;word-break:break-all;color:inherit;
  }
  .tags button:active{transform:scale(.96)}
  .tiny{font-size:11px;color:var(--soft);text-align:center;margin-top:10px}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:40;
    background:#6E5A53;color:#fff;font-size:13.5px;border-radius:999px;padding:11px 18px;
    opacity:0;transition:all .25s;pointer-events:none;max-width:90%;text-align:center;
    box-shadow:0 8px 20px rgba(80,50,40,.25);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* 방문 도장 바 */
  .stamp{
    position:sticky;top:8px;z-index:10;cursor:pointer;
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:2px solid #fff;border-radius:22px;padding:10px 12px 10px 14px;
    box-shadow:0 8px 22px rgba(232,170,150,.22);
    user-select:none;-webkit-user-select:none;
  }
  .stamp:active{transform:scale(.99)}
  .st-row{display:flex;align-items:center;gap:8px}
  .st-t{font-family:'Jua',sans-serif;font-size:15px;color:#C9788C;white-space:nowrap}
  .st-s{font-size:12px;color:var(--soft);white-space:nowrap}
  .st-s b{color:#E77C98;font-size:14px}
  .st-more{margin-left:auto;font-size:12px;color:#C9788C;white-space:nowrap}
  .st-bar{display:flex;height:7px;border-radius:9px;overflow:hidden;background:#F6EAE3;margin:8px 0 8px}
  .st-bar i{display:block;height:100%}
  .st-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .st-pills::-webkit-scrollbar{display:none}
  .st-pill{flex:none;display:flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;white-space:nowrap}
  .st-pill b{font-size:13px}
  .st-empty{font-size:12px;color:var(--soft);padding-top:6px}

  /* 달력/카드 위 방문 배지 */
  .vb{
    position:absolute;right:3px;top:4px;min-width:17px;height:17px;border-radius:9px;
    background:#fff;font-size:10.5px;line-height:17px;text-align:center;font-weight:700;padding:0 4px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .bar.has-v{padding-right:24px}
  .cv{flex:none;font-size:12px;border-radius:999px;padding:4px 9px;font-weight:700}

  /* 시트 안 방문 카운터 */
  .visit{
    margin-top:14px;display:flex;align-items:center;gap:10px;border-radius:20px;padding:12px 12px 12px 16px;
  }
  .visit .vlbl{font-size:12px;opacity:.8}
  .visit .vnum{font-size:15px;margin-top:2px}
  .visit .vnum b{font-family:'Jua',sans-serif;font-size:26px;font-weight:400;margin-right:2px;display:inline-block}
  .visit .vnum b.bump{animation:pop .35s ease}
  .stepper{margin-left:auto;display:flex;gap:8px}
  .stepper button{
    width:42px;height:42px;border-radius:50%;border:0;font-size:22px;line-height:1;cursor:pointer;
    background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);font-family:inherit;
    touch-action:manipulation;
  }
  .stepper button:active{transform:scale(.9)}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper.sm button{width:32px;height:32px;font-size:18px}

  /* 방문 기록 상세 */
  .vh-sum{font-size:14px;color:#7D6A63;margin-top:4px}
  .vh-sum b{color:#E77C98;font-size:18px}
  .vh-sec{font-size:12.5px;color:var(--soft);margin:18px 4px 8px}
  .vh-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 10px 9px 10px;margin-bottom:8px;box-shadow:0 2px 10px rgba(232,170,150,.12)}
  .vh-row.zero{opacity:.55}
  .vh-row .chip{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:18px}
  .vh-row .nm{min-width:0;flex:1}
  .vh-row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vh-row .nm .v{font-size:14.5px;font-weight:700}
  .vh-row .nm .e{font-size:11.5px;color:var(--soft);margin-top:1px}
  .vh-row .cnt{font-family:'Jua',sans-serif;font-size:18px;min-width:34px;text-align:center}
  .reset{display:block;margin:18px auto 0;border:0;background:none;font:inherit;font-size:12px;color:#C2A79C;text-decoration:underline;cursor:pointer;padding:6px}
  .reset.warn{color:#D9536F;font-weight:700}

  /* 도장 찍은 날 */
  .log{background:rgba(255,255,255,.7);border-radius:24px;padding:6px 10px;border:2px solid #fff}
  .lg-row{display:flex;align-items:center;gap:10px;padding:9px 2px;cursor:pointer;border-top:1.5px dashed #F3E2D8}
  .lg-row:first-child{border-top:0}
  .lg-row:active{opacity:.7}
  .lg-date{
    flex:none;border:0;font:inherit;font-size:13px;cursor:pointer;color:#8C7169;
    background:#FFF1E4;border-radius:12px;padding:7px 9px;min-width:84px;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:4px;
  }
  .lg-row:not(.first) .lg-date{background:transparent;color:#CDB9AF}
  .lg-date span{font-size:11px;opacity:.6}
  .lg-row .chip{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:16px}
  .lg-row .nm{min-width:0;flex:1}
  .lg-row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg-row .v{font-size:14px;font-weight:700}
  .lg-row .e{font-size:11.5px;color:var(--soft);margin-top:1px}

  /* 날짜 고치기 */
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
  .dchip{
    border:0;font:inherit;cursor:pointer;background:#fff;border-radius:16px;padding:8px 0 7px;
    display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 8px rgba(232,170,150,.15);
  }
  .dchip b{font-size:17px}
  .dchip span{font-size:11px;opacity:.75}
  .dchip:active{transform:scale(.94)}
  .dinput{
    width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:16px;border:2px solid #F3E2D8;
    background:#fff;color:var(--ink);
  }
  .ebtns{display:flex;gap:10px;margin-top:20px}
  .ebtn{flex:1;border:0;font:inherit;font-size:15px;padding:14px 0;border-radius:18px;cursor:pointer}
  .ebtn.save{color:#fff;flex:1.4}
  .ebtn.del{background:#F6EAE3;color:#A08F87}
  .ebtn.del.warn{background:#FFE1E7;color:#D9536F;font-size:13px}
  .ebtn:active{transform:scale(.97)}

  footer{text-align:center;font-size:11.5px;color:#C2B1A9;margin-top:26px}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i><i></i></div>

<div class="wrap">
  <div class="stamp" id="stamp" role="button" aria-label="방문 기록 자세히 보기"></div>
  <header>
    <svg class="cloud" viewBox="0 0 290 120" aria-hidden="true">
      <path d="M58 104c-26 0-44-16-44-36s18-34 40-34c5-18 24-30 46-28 12-14 32-20 52-14 14 4 25 13 30 25 6-3 13-4 20-4 24 0 42 16 42 36 18 2 32 16 32 30 0 15-14 25-32 25z" fill="#fff" opacity=".9"/>
    </svg>
    <h1>규리단길 뿌시기<span class="heart">♡</span></h1>
    <p class="sub">2026 박규원 생일 이벤트 · 혜화역 · 11.11 – 11.22</p>
    <div class="hint">
      <span class="hint-lead">📅 달력 스케쥴 표를</span>
      <span>👆 <b>터치</b> 해시태그 보기</span>

    {venue:'Nook haus', h:{d:'11:00–23:00'}, name:'𝑳𝒐𝒗𝒆 𝑨𝒍𝒘𝒂𝒚𝒔', id:'@hbd_1117', s:16, e:22, color:'apricot', emoji:'🏠',
     tags:['#HBD_1117_KYUWON']},
    {venue:'크림슨파더', h:{d:'11:00–21:00',1:'11:00–19:00'}, name:'도토리마을', id:'@ALWAYS_kyU_1117', s:17, e:20, color:'peach', emoji:'🌰',

    {venue:'리오라플라워', h:{d:'13:00–19:00'}, hnote:'11.17 하루만 열려요', name:'More White and Red', id:'@pkw_blossom', s:17, e:17, color:'pink', emoji:'🌷',
     tags:['#감성배우와_사랑이_날_완전하게_만들어','#박규원_있는_한_지지_않으리_261117을_축하하라']}
  ];

  var DOW = ['일','월','화','수','목','금','토'];
  // 2026년 11월 1일은 일요일
  function dow(d){ return (d-1)%7; }
  function fmt(d){ return '11.'+d+'('+DOW[dow(d)]+')'; }
  // ---------- 운영시간 ----------
  var DOW_ORDER = [1,2,3,4,5,6,0]; // 월~일 순서
  function hoursOn(ev, d){ var h = ev.h||{}; return (h[dow(d)]!==undefined ? h[dow(d)] : h.d) || ''; }
  function shortH(t){
    if (!t || t==='휴무' || t==='24시간') return t;
    var m = t.match(/^(\d{1,2}):(\d{2})–(\d{1,2}):(\d{2})$/);
    if (!m) return t;
    if (m[2]==='00' && m[4]==='00') return (+m[1])+'–'+(+m[3])+'시';
    return t;
  }
  function hoursSummary(ev){
    var h = ev.h||{}; if (!h.d) return '';
    var parts = [shortH(h.d)];
    var closed = [], other = [];
    DOW_ORDER.forEach(function(w){
      if (h[w]===undefined) return;
      if (h[w]==='휴무') closed.push(DOW[w]); else other.push(DOW[w]+' '+shortH(h[w]));
    });
    if (other.length) parts.push(other.join(' · '));
    if (closed.length) parts.push(closed.join('·')+' 휴무');
    return parts.join(' · ');
  }
  function hoursPill(ev, day){
    if (!ev.h) return '<span class="hrs tbd">⏰ 시간 확인 중</span>';
    if (day){
      var t = hoursOn(ev, day);
      return t==='휴무' ? '<span class="hrs off">🚫 이날 휴무</span>' : '<span class="hrs">⏰ '+shortH(t)+'</span>';
    }
    var hasClosed = false;
    for (var d=ev.s; d<=ev.e; d++) if (hoursOn(ev,d)==='휴무') hasClosed = true;
    return '<span class="hrs">⏰ '+hoursSummary(ev)+'</span>';
  }
  function hoursBlock(ev, col){
    if (!ev.h) return '';
    var chips = '';
    for (var d=ev.s; d<=ev.e; d++){
      var t = hoursOn(ev, d), off = t==='휴무';
      chips += '<div class="hchip'+(off?' off':'')+(d===BDAY?' bd':'')+(d===TODAY?' td':'')+'">'+
        '<b>'+d+'<small>'+DOW[dow(d)]+'</small></b><span>'+(off?'휴무':shortH(t))+'</span></div>';
    }
    var notes = [];
    if (ev.hnote) notes.push(ev.hnote);
    return '<div class="hbox">'+
      '<div class="hlbl" style="color:'+col[1]+'">⏰ 운영시간</div>'+
      '<div class="hgrid">'+chips+'</div>'+
      (notes.length?'<div class="hnote">· '+notes.map(esc).join('<br>· ')+'</div>':'')+
    '</div>';
  }
  function period(ev){ return ev.s===ev.e ? fmt(ev.s) : fmt(ev.s)+' – '+fmt(ev.e); }
  function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var now = new Date();
  var TODAY = (now.getFullYear()===2026 && now.getMonth()===10) ? now.getDate() : -1;
  var BDAY = 17;
  var state = { sel: (TODAY>=11 && TODAY<=22) ? TODAY : BDAY, all:false };

  // ---------- 복사 ----------
  var toastTimer;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1700);
  }
  function execCopy(text){
    var ok = false;
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (window.getSelection) window.getSelection().removeAllRanges();
    }catch(e){ ok = false; }
    return ok;
  }
  // 성공 여부를 Promise로 돌려줌
  function copyText(text, msg){
    if (execCopy(text)) { toast(msg); return Promise.resolve(true); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ toast(msg); return true; })
        .catch(function(){ return false; });
    }
    return Promise.resolve(false);
  }
  function copyOrWarn(text, msg){
    copyText(text, msg).then(function(ok){ if(!ok) toast('복사가 막혔어요 😢 '+text); });
  }

  // ---------- 터치 / 꾸욱 ----------
  function bindPress(el, ev){
    var timer=null, sx=0, sy=0, fired=false, copied=false, active=false;
    function reset(){ clearTimeout(timer); timer=null; active=false; el.classList.remove('pressing'); }
    el.addEventListener('pointerdown', function(e){
      if (e.button && e.button>0) return;
      fired=false; copied=false; active=true; sx=e.clientX; sy=e.clientY;
      el.classList.remove('pressed'); void el.offsetWidth; el.classList.add('pressing');
      timer = setTimeout(function(){
        fired = true; el.classList.remove('pressing'); el.classList.add('pressed');
        try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
        copyText(ev.id, ev.id+' 복사 완료 ✨').then(function(ok){
          if (ok) copied = true; else if (active) toast('손을 떼면 복사돼요');
        });
      }, 550);
    });
    el.addEventListener('pointermove', function(e){
      if (!timer) return;
      if (Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10) reset();
    });
    function up(){
      var wasActive = active;
      reset();
      if (fired && !copied && wasActive){ copied = true; copyOrWarn(ev.id, ev.id+' 복사 완료 ✨'); }
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('touchend', function(){ if (fired && !copied){ copied=true; copyOrWarn(ev.id, ev.id+' 복사 완료 ✨'); } });
    el.addEventListener('pointercancel', reset);
    el.addEventListener('pointerleave', function(){ if (timer) reset(); });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(e){
      if (fired){ e.preventDefault(); fired=false; return; }
      openSheet(ev);
    });
  }

  // ---------- 달력 ----------
  var WEEK_STARTS = [8, 15, 22];
  function renderCalendar(){
    var root = document.getElementById('weeks');
    root.innerHTML = '';
    WEEK_STARTS.forEach(function(ws){
      var we = ws+6;
      var week = document.createElement('div'); week.className='week';

      var cols = document.createElement('div'); cols.className='cols';
      var dates = document.createElement('div'); dates.className='dates';
      for (var d=ws; d<=we; d++){
        var c = document.createElement('div');
        if (!state.all && d===state.sel) c.classList.add('sel');
        if (d===BDAY) c.classList.add('bday');
        cols.appendChild(c);

        var b = document.createElement('button');
        var cls = [];
        if (dow(d)===0) cls.push('sun');
        if (dow(d)===6) cls.push('sat');
        var has = EVENTS.some(function(ev){ return d>=ev.s && d<=ev.e; });
        if (!has) cls.push('off');
        if (d===TODAY) cls.push('today');
        if (d===BDAY) cls.push('bdayc');
        b.className = cls.join(' ');
        var tag = d===BDAY ? '🎂' : (d===TODAY ? '오늘' : '');
        b.innerHTML = '<span class="num">'+d+'</span><span class="tag">'+tag+'</span>';
        b.setAttribute('aria-label','11월 '+d+'일');
        (function(day){
          b.addEventListener('click', function(){
            state.sel = day; state.all = false;
            renderCalendar(); renderList();
            document.getElementById('listWrap').scrollIntoView({behavior:'smooth', block:'start'});
          });
        })(d);
        dates.appendChild(b);
      }

      var bars = document.createElement('div'); bars.className='bars';
      var inWeek = EVENTS.filter(function(ev){ return ev.e>=ws && ev.s<=we; })
        .sort(function(a,b){ return (a.s-b.s) || ((b.e-b.s)-(a.e-a.s)); });
      var laneEnd = [];
      inWeek.forEach(function(ev){
        var s = Math.max(ev.s, ws), e = Math.min(ev.e, we);
        var lane = 0;
        while (laneEnd[lane]!==undefined && laneEnd[lane] >= s) lane++;
        laneEnd[lane] = e;
        var col = C[ev.color];
        var bar = document.createElement('div');
        bar.className = 'bar pressable' + (ev.s<ws?' cl':'') + (ev.e>we?' cr':'');
        bar.style.gridColumn = (s-ws+1)+' / span '+(e-s+1);
        bar.style.gridRow = (lane+1);
        bar.style.background = col[0];
        bar.style.color = col[1];
        var span = e-s+1;
        bar.innerHTML = esc(ev.venue) + (span>=3 ? ' <span style="opacity:.7">· '+esc(ev.name)+'</span>' : '');
        bar.title = ev.venue+' · '+ev.name;
        if (getV(ev)){ bar.classList.add('has-v'); bar.innerHTML += '<span class="vb" style="color:'+col[1]+'">'+getV(ev)+'</span>'; }
        bindPress(bar, ev);
        bars.appendChild(bar);
      });

      week.appendChild(cols); week.appendChild(dates); week.appendChild(bars);
      root.appendChild(week);
    });
  }

  // ---------- 리스트 ----------
  function renderList(){
    var title = document.getElementById('listTitle');
    var cards = document.getElementById('cards');
    var btn = document.getElementById('toggleAll');
    var list;
    if (state.all){
      list = EVENTS.slice().sort(function(a,b){ return (a.s-b.s)||(a.e-b.e); });
      title.innerHTML = '전체 일정<small>'+list.length+'곳</small>';
      btn.textContent = '날짜별 보기'; btn.classList.add('on');
    } else {
      var d = state.sel;
      list = EVENTS.filter(function(ev){ return d>=ev.s && d<=ev.e; });
      title.innerHTML = '11월 '+d+'일 ('+DOW[dow(d)]+')'+(d===BDAY?' 🎂':'')+'<small>'+list.length+'곳</small>';
      btn.textContent = '전체 보기'; btn.classList.remove('on');
    }
    cards.innerHTML = '';
    if (!list.length){
      cards.innerHTML = '<div class="empty">이 날은 이벤트가 없어요 ☁️</div>';
      return;
    }
    list.forEach(function(ev){
      var col = C[ev.color];
      var card = document.createElement('div');
      card.className = 'card pressable';
      card.innerHTML =
        '<div class="chip" style="background:'+col[0]+'">'+ev.emoji+'</div>'+
        '<div class="body">'+
          '<div class="venue" style="color:'+col[1]+'">📍 '+esc(ev.venue)+hoursPill(ev, state.all?null:state.sel)+'</div>'+
          '<div class="ev">'+esc(ev.name)+'</div>'+
          '<div class="meta"><span>🗓 '+period(ev)+'</span><span class="at">'+esc(ev.id)+'</span></div>'+
        '</div>'+
        (getV(ev) ? '<span class="cv" style="background:'+col[0]+';color:'+col[1]+'">🐾 '+getV(ev)+'회</span>' : '')+
        '<div class="arrow">›</div>';
      bindPress(card, ev);
      cards.appendChild(card);
    });
  }
  document.getElementById('toggleAll').addEventListener('click', function(){
    state.all = !state.all; renderCalendar(); renderList();

  // ---------- 방문 기록 (날짜별 도장) ----------
  var SKEY = 'gyuri-stamps-2026', OLDKEY = 'gyuri-visits-2026';
  var storageOK = true, stamps = [];
  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayYmd(){ return ymd(new Date()); }
  function parseYmd(str){ var a=str.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
  function fmtYmd(str){ var d=parseYmd(str); return (d.getMonth()+1)+'.'+d.getDate()+' ('+DOW[d.getDay()]+')'; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  try {
    stamps = JSON.parse(localStorage.getItem(SKEY) || '[]') || [];
    // 예전 방식(횟수만 저장)에서 옮겨오기
    var old = JSON.parse(localStorage.getItem(OLDKEY) || 'null');
    if (old && !stamps.length){
      Object.keys(old).forEach(function(v){ for (var i=0;i<old[v];i++) stamps.push({id:uid(), venue:v, date:todayYmd(), t:Date.now()+i}); });
      localStorage.setItem(SKEY, JSON.stringify(stamps));
    }
    if (old) localStorage.removeItem(OLDKEY);
  } catch(e){ storageOK = false; }
  function saveVisits(){ try{ localStorage.setItem(SKEY, JSON.stringify(stamps)); }catch(e){ storageOK = false; } }
  function stampsOf(ev){
    return stamps.filter(function(x){ return x.venue===ev.venue; })
      .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.t-b.t; });
  }
  function getV(ev){ return stampsOf(ev).length; }
  function evByVenue(v){ return EVENTS.filter(function(x){ return x.venue===v; })[0]; }
  function setV(ev, n){
    n = Math.max(0, Math.min(99, n));
    var cur = getV(ev);
    while (cur < n){ stamps.push({id:uid(), venue:ev.venue, date:todayYmd(), t:Date.now()+cur}); cur++; }
    while (cur > n){
      // 가장 최근에 찍은 도장부터 지움
      var mine = stamps.filter(function(x){ return x.venue===ev.venue; }).sort(function(a,b){ return b.t-a.t; });
      stamps.splice(stamps.indexOf(mine[0]), 1); cur--;
    }
    saveVisits(); refreshVisits(ev);
  }
  function totals(){
    var m=0; EVENTS.forEach(function(ev){ if(getV(ev)) m++; });
    return {places:m};
  }
  function progressBar(style){
    var visited = EVENTS.filter(function(ev){ return getV(ev)>0; });
    var rest = EVENTS.length - visited.length;
    var segs = visited.map(function(ev){ return '<i style="flex:1;background:'+C[ev.color][0]+';box-shadow:inset 0 0 0 1px '+C[ev.color][1]+'22"></i>'; });
    for (var i=0;i<rest;i++) segs.push('<i style="flex:1;background:transparent"></i>');
    return '<div class="st-bar"'+(style?' style="'+style+'"':'')+'>'+segs.join('')+'</div>';
  }
  function renderStamp(){
    var el = document.getElementById('stamp');
    var T = totals();
    var visited = EVENTS.filter(function(ev){ return getV(ev)>0; })
      .sort(function(a,b){ return getV(b)-getV(a); });
    var html = '<div class="st-row"><span class="st-t">🐾 내 생카 도장</span>'+
      '<span class="st-s"><b>'+T.places+'</b> / '+EVENTS.length+'곳 방문</span>'+
      '<span class="st-more">자세히 ›</span></div>';
    html += progressBar();
    if (!visited.length){
      html += '<div class="st-empty">일정을 누르고 <b>+</b>를 눌러 방문 도장을 찍어보세요 💌</div>';
    } else {
      html += '<div class="st-pills">'+visited.map(function(ev){
        var c = C[ev.color];
        return '<span class="st-pill" style="background:'+c[0]+';color:'+c[1]+'">'+ev.emoji+' '+esc(ev.venue)+' <b>'+getV(ev)+'</b></span>';
      }).join('')+'</div>';
    }
    el.innerHTML = html;
  }

  // 최하단 도장 날짜 기록
  function renderLog(){
    var el = document.getElementById('log');
    var list = stamps.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.t-b.t; });
    if (!list.length){
      el.innerHTML = '<div class="empty">아직 찍힌 도장이 없어요 🐾<br><span style="font-size:12px">생카에 다녀오면 + 를 눌러 도장을 찍어주세요</span></div>';
      return;
    }
    var html = '', last = null;
    list.forEach(function(st){
      var ev = evByVenue(st.venue); if (!ev) return;
      var c = C[ev.color];
      var nth = stampsOf(ev).indexOf(st) + 1;
      var newDay = st.date !== last; last = st.date;
      html += '<div class="lg-row'+(newDay?' first':'')+'" data-id="'+st.id+'">'+
        '<button class="lg-date" data-id="'+st.id+'">'+fmtYmd(st.date)+'<span>✎</span></button>'+
        '<div class="chip" style="background:'+c[0]+'">'+ev.emoji+'</div>'+
        '<div class="nm"><div class="v" style="color:'+c[1]+'">'+esc(ev.venue)+'</div><div class="e">'+nth+'번째 방문 · '+esc(ev.name)+'</div></div>'+
      '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.lg-row').forEach(function(r){
      r.addEventListener('click', function(){ openEdit(r.getAttribute('data-id')); });
    });
  }

  // 도장 날짜 고치기 시트
  function openEdit(id){
    var st = stamps.filter(function(x){ return x.id===id; })[0];
    if (!st) return;
    current = {type:'edit', id:id, sel:st.date, delArmed:false};
    renderEditBody();
    sheet.classList.add('show'); backdrop.classList.add('show');
    sheet.scrollTop = 0;
  }
  function renderEditBody(){
    var st = stamps.filter(function(x){ return x.id===current.id; })[0];
    if (!st){ closeSheet(); return; }
    var ev = evByVenue(st.venue), c = C[ev.color];
    var nth = stampsOf(ev).indexOf(st) + 1;
    var chips = '';
    for (var d=ev.s; d<=ev.e; d++){
      var val = '2026-11-'+pad(d);
      var on = current.sel===val;
      chips += '<button class="dchip'+(on?' on':'')+'" data-d="'+val+'" style="'+(on?'background:'+c[1]+';color:#fff':'color:'+c[1])+'">'+
        '<b>'+d+'</b><span>'+DOW[dow(d)]+'</span></button>';
    }
    var body = document.getElementById('sheetBody');
    body.innerHTML =
      '<span class="s-badge" style="background:'+c[0]+';color:'+c[1]+'">✎ 도장 날짜 고치기</span>'+
      '<div class="s-venue" style="color:'+c[1]+'">'+ev.emoji+' '+esc(ev.venue)+'</div>'+
      '<div class="s-ev">'+nth+'번째 방문 · 지금 '+fmtYmd(current.sel)+'</div>'+
      '<div class="vh-sec">이 생카가 열리는 날 ('+period(ev)+')</div>'+
      '<div class="dgrid">'+chips+'</div>'+
      '<div class="vh-sec">다른 날짜로 고르기</div>'+
      '<input type="date" class="dinput" id="dInput" value="'+current.sel+'">'+
      '<div class="ebtns">'+
        '<button class="ebtn del'+(current.delArmed?' warn':'')+'" id="eDel">'+(current.delArmed?'한 번 더 누르면 지워져요':'도장 지우기')+'</button>'+
        '<button class="ebtn save" id="eSave" style="background:'+c[1]+'">저장</button>'+
      '</div>';
    body.querySelectorAll('.dchip').forEach(function(b){
      b.addEventListener('click', function(){ current.sel = b.getAttribute('data-d'); renderEditBody(); });
    });
    body.querySelector('#dInput').addEventListener('change', function(e){
      if (e.target.value){ current.sel = e.target.value; renderEditBody(); }
    });
    body.querySelector('#eSave').addEventListener('click', function(){
      st.date = current.sel; saveVisits();
      toast(ev.emoji+' '+fmtYmd(st.date)+' 도장으로 바꿨어요');
      closeSheet(); refreshVisits();
    });
    body.querySelector('#eDel').addEventListener('click', function(){
      if (!current.delArmed){
        current.delArmed = true; renderEditBody();
        clearTimeout(current.delTimer);
        current.delTimer = setTimeout(function(){ if(current && current.type==='edit'){ current.delArmed=false; renderEditBody(); } }, 3500);
      } else {
        stamps.splice(stamps.indexOf(st), 1); saveVisits();
        toast('도장을 지웠어요');
        closeSheet(); refreshVisits();
      }
    });
  }
  document.getElementById('stamp').addEventListener('click', function(){ openVisits(); });

  var current = null; // 열린 시트 정보
  function refreshVisits(ev){
    renderStamp(); renderCalendar(); renderList(); renderLog();
    if (!current) return;
    if (current.type==='event'){
      var b = document.getElementById('vCount'), m = document.getElementById('vMinus'), s = document.getElementById('vState');
      if (b){ b.textContent = getV(current.ev); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
      if (m) m.disabled = getV(current.ev)===0;
      if (s) s.textContent = getV(current.ev) ? '회 방문했어요' : '회 · 아직 방문 전';
    } else if (current.type==='visits'){
      renderVisitsBody();
    }
  }

  // ---------- 바텀시트 ----------
  var sheet = document.getElementById('sheet'), backdrop = document.getElementById('backdrop');
  function openSheet(ev){
    var col = C[ev.color];
    var body = document.getElementById('sheetBody');
    body.innerHTML =
      '<span class="s-badge" style="background:'+col[0]+';color:'+col[1]+'">'+ev.emoji+' 생일카페</span>'+
      '<div class="s-venue" style="color:'+col[1]+'">📍 '+esc(ev.venue)+'</div>'+
      '<div class="s-ev">'+esc(ev.name)+'</div>'+
      '<div class="s-when"><span>🗓 '+period(ev)+'</span></div>'+
      hoursBlock(ev, col)+
      '<div class="visit" style="background:'+col[2]+';color:'+col[1]+';box-shadow:inset 0 0 0 2px '+col[0]+'">'+
        '<div><div class="vlbl">🐾 방문 기록</div><div class="vnum"><b id="vCount">'+getV(ev)+'</b><span id="vState">'+(getV(ev)?'회 방문했어요':'회 · 아직 방문 전')+'</span></div></div>'+
        '<div class="stepper"><button id="vMinus" aria-label="방문 횟수 빼기" style="color:'+col[1]+'"'+(getV(ev)?'':' disabled')+'>−</button>'+
        '<button id="vPlus" aria-label="방문 횟수 더하기" style="color:#fff;background:'+col[1]+'">+</button></div>'+
      '</div>'+
      '<a class="maplink" href="https://map.naver.com/p/search/'+encodeURIComponent(ev.map||('혜화역 '+ev.venue))+'" target="_blank" rel="noopener">'+
        '<span class="nv">N</span><span>네이버 지도 · 혜화역 <b>'+esc(ev.venue)+'</b></span><span class="go">›</span></a>'+
      '<div class="idrow"><span class="id" style="color:'+col[1]+'">'+esc(ev.id)+'</span><button class="mini" id="copyId">아이디 복사</button></div>'+
      (ev.note?'<div class="note">'+esc(ev.note)+'</div>':'')+
      '<div class="tagbox" style="background:'+col[2]+';box-shadow:inset 0 0 0 2px '+col[0]+'">'+
        '<span class="lbl" style="color:'+col[1]+'"># 해시태그</span>'+
        '<button class="copyall" id="copyTags" style="color:'+col[1]+'">📋 해시태그 복사</button>'+
        '<div class="tags">'+ev.tags.map(function(t,i){ return '<button data-i="'+i+'" style="color:'+col[1]+'">'+esc(t)+'</button>'; }).join('')+'</div>'+
      '</div>'+
      '<div class="tiny">해시태그 하나만 누르면 그것만 복사돼요</div>';
    body.querySelector('#vPlus').addEventListener('click', function(){
      setV(ev, getV(ev)+1);
      try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
      if (getV(ev)===1) toast(ev.emoji+' '+ev.venue+' 첫 방문 도장 쾅!');
    });
    body.querySelector('#vMinus').addEventListener('click', function(){ setV(ev, getV(ev)-1); });
    body.querySelector('#copyId').addEventListener('click', function(){ copyOrWarn(ev.id, ev.id+' 복사 완료 ✨'); });
    body.querySelector('#copyTags').addEventListener('click', function(){
      copyOrWarn(ev.tags.join(' '), '해시태그 '+ev.tags.length+'개 복사 완료 💕');
    });
    body.querySelectorAll('.tags button').forEach(function(b){
      b.addEventListener('click', function(){
        var t = ev.tags[+b.getAttribute('data-i')];
        copyOrWarn(t, t+' 복사 완료');
      });
    });
    current = {type:'event', ev:ev};
    sheet.classList.add('show'); backdrop.classList.add('show');
    sheet.scrollTop = 0;
  }

  // 방문 기록 상세 시트
  function openVisits(){
    // 연 순간의 순서를 고정 (누르는 동안 줄이 움직이지 않게)
    var order = EVENTS.slice().sort(function(a,b){ return (getV(b)-getV(a)) || (a.s-b.s); });
    current = {type:'visits', order:order, resetArmed:false};
    renderVisitsBody();
    sheet.classList.add('show'); backdrop.classList.add('show');
    sheet.scrollTop = 0;
  }
  function renderVisitsBody(){
    var body = document.getElementById('sheetBody');
    var T = totals();
    var order = current.order;
    var visited = order.filter(function(ev){ return current.wasVisited ? current.wasVisited[ev.venue] : getV(ev)>0; });
    if (!current.wasVisited){
      current.wasVisited = {};
      order.forEach(function(ev){ current.wasVisited[ev.venue] = getV(ev)>0; });
      visited = order.filter(function(ev){ return current.wasVisited[ev.venue]; });
    }
    var rest = order.filter(function(ev){ return !current.wasVisited[ev.venue]; });
    function row(ev){
      var c = C[ev.color], v = getV(ev);
      return '<div class="vh-row'+(v?'':' zero')+'">'+
        '<div class="chip" style="background:'+c[0]+'">'+ev.emoji+'</div>'+
        '<div class="nm"><div class="v" style="color:'+c[1]+'">'+esc(ev.venue)+'</div><div class="e">'+esc(ev.name)+' · '+period(ev)+'</div></div>'+
        '<div class="cnt" style="color:'+c[1]+'">'+v+'회</div>'+
        '<div class="stepper sm"><button data-a="-1" data-v="'+esc(ev.venue)+'" style="color:'+c[1]+'"'+(v?'':' disabled')+'>−</button>'+
        '<button data-a="1" data-v="'+esc(ev.venue)+'" style="color:#fff;background:'+c[1]+'">+</button></div>'+
      '</div>';
    }
    var bar = progressBar('height:10px;margin:12px 0 4px');
    body.innerHTML =
      '<span class="s-badge" style="background:#FFE3EA;color:#C9788C">🐾 방문 도장</span>'+
      '<div class="s-venue" style="color:#D9879B">나의 규리단길 기록</div>'+
      '<div class="vh-sum"><b>'+T.places+'</b> / '+EVENTS.length+'곳 방문</div>'+
      bar+
      (visited.length ? '<div class="vh-sec">💗 다녀온 곳</div>'+visited.map(row).join('') : '<div class="vh-sec">아직 다녀온 곳이 없어요. + 를 눌러 도장을 찍어보세요!</div>')+
      (rest.length ? '<div class="vh-sec">☁️ 아직 안 가본 곳</div>'+rest.map(row).join('') : '')+
      (storageOK ? '<div class="tiny">기록은 지금 쓰는 이 브라우저에 저장돼요</div>' : '<div class="tiny">⚠️ 이 브라우저에서는 기록이 저장되지 않아 새로고침하면 사라져요</div>')+
      (T.places ? '<button class="reset'+(current.resetArmed?' warn':'')+'" id="vReset">'+(current.resetArmed?'정말 지울까요? 한 번 더 누르면 모두 지워져요':'방문 기록 모두 지우기')+'</button>' : '');
    body.querySelectorAll('.vh-row button').forEach(function(b){
      b.addEventListener('click', function(){
        var name = b.getAttribute('data-v');
        var ev = EVENTS.filter(function(x){ return x.venue===name; })[0];
        setV(ev, getV(ev) + (+b.getAttribute('data-a')));
      });
    });
    var r = body.querySelector('#vReset');
    if (r) r.addEventListener('click', function(){
      if (!current.resetArmed){
        current.resetArmed = true; renderVisitsBody();
        clearTimeout(current.resetTimer);
        current.resetTimer = setTimeout(function(){ if(current && current.type==='visits'){ current.resetArmed=false; renderVisitsBody(); } }, 3500);
      } else {
        stamps = []; saveVisits(); current.resetArmed = false; current.wasVisited = null;
        toast('방문 기록을 모두 지웠어요');
        refreshVisits();
      }
    });
  }

  function closeSheet(){ sheet.classList.remove('show'); backdrop.classList.remove('show'); current = null; }
  backdrop.addEventListener('click', closeSheet);
  document.getElementById('closeBtn').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeSheet(); });

  // 시트 아래로 끌어내려 닫기
  var dragY = null;
  sheet.addEventListener('touchstart', function(e){ if (sheet.scrollTop<=0) dragY = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchmove', function(e){
    if (dragY===null) return;
    var dy = e.touches[0].clientY - dragY;
    if (dy>0){ sheet.style.transition='none'; sheet.style.transform='translate(-50%,'+dy+'px)'; }
  }, {passive:true});
  sheet.addEventListener('touchend', function(e){
    if (dragY===null) return;
    var dy = e.changedTouches[0].clientY - dragY; dragY = null;
    sheet.style.transition=''; sheet.style.transform='';
    if (dy>90) closeSheet();
  });

  renderStamp(); renderCalendar(); renderList(); renderLog();
})();
</script>
</body>
</html>
